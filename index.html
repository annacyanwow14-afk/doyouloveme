<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Do You Love Me?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      font-family: "DM Sans", sans-serif;
      color: #54383e;

      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.75), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(190,110,125,.12), transparent 30%),
        linear-gradient(135deg, #f4d8d8 0%, #f7e4dd 45%, #efd0d0 100%);
    }

    /* subtle paper texture */

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;

      opacity: .22;

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(100,70,65,.035) 0px,
          rgba(100,70,65,.035) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    /* --------------------------
       BACKGROUND SCRAPS
    -------------------------- */

    .paper {
      position: fixed;
      pointer-events: none;
    }

    .paper.one {
      width: 230px;
      height: 170px;
      left: -55px;
      top: 70px;

      background: #b86672;

      opacity: .45;

      transform: rotate(-16deg);

      clip-path: polygon(
        7% 8%,
        90% 0,
        100% 78%,
        82% 100%,
        4% 90%
      );
    }

    .paper.two {
      width: 190px;
      height: 220px;

      right: -45px;
      top: 100px;

      background: #e9bfc0;

      opacity: .72;

      transform: rotate(11deg);

      clip-path: polygon(
        4% 0,
        95% 7%,
        100% 91%,
        11% 100%
      );
    }

    .paper.three {
      width: 200px;
      height: 145px;

      left: 6%;
      bottom: -30px;

      background:
        repeating-linear-gradient(
          0deg,
          #f1ded5 0px,
          #f1ded5 23px,
          #d6bdb6 24px
        );

      opacity: .65;

      transform: rotate(8deg);
    }

    .paper.four {
      width: 145px;
      height: 145px;

      right: 8%;
      bottom: 4%;

      border: 2px solid rgba(112,67,76,.16);

      transform: rotate(-12deg);
    }

    /* handwritten background notes */

    .note {
      position: fixed;

      font-family: "Caveat", cursive;

      color: rgba(102,59,68,.30);

      pointer-events: none;
    }

    .note.one {
      top: 17%;
      left: 8%;

      font-size: 27px;

      transform: rotate(-8deg);
    }

    .note.two {
      right: 7%;
      bottom: 18%;

      font-size: 25px;

      transform: rotate(7deg);
    }

    /* --------------------------
       MAIN CARD
    -------------------------- */

    .card-wrap {
      position: relative;

      width: min(88vw, 510px);

      z-index: 5;
    }

    .back-paper {
      position: absolute;
      inset: 10px;

      background: #bb727d;

      border-radius: 25px;

      transform: rotate(-4deg);

      box-shadow:
        0 25px 60px rgba(89,49,57,.18);
    }

    .back-paper-two {
      position: absolute;
      inset: 7px;

      background: #e3afb1;

      border-radius: 25px;

      transform: rotate(3deg);
    }

    .card {
      position: relative;

      min-height: 475px;

      padding: 65px 45px 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255,250,247,.95),
          rgba(249,230,226,.95)
        );

      border: 1px solid rgba(255,255,255,.75);

      border-radius: 28px;

      box-shadow:
        0 30px 75px rgba(84,48,54,.22),
        inset 0 0 0 1px rgba(255,255,255,.45);

      backdrop-filter: blur(10px);

      overflow: hidden;

      animation: appear .8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* --------------------------
       TAPE
    -------------------------- */

    .tape {
      position: absolute;

      top: -2px;
      left: 50%;

      width: 115px;
      height: 35px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      background: rgba(199,151,145,.45);

      z-index: 5;
    }

    /* --------------------------
       POLAROID/PAPER DETAIL
    -------------------------- */

    .mini-paper {
      position: absolute;

      width: 85px;
      height: 70px;

      left: -18px;
      top: 80px;

      background: #f8eee7;

      box-shadow:
        0 8px 20px rgba(80,50,55,.12);

      transform: rotate(-11deg);
    }

    .mini-paper::after {
      content: "";

      position: absolute;

      width: 55px;
      height: 42px;

      left: 15px;
      top: 11px;

      background: #d8a0a6;
    }

    /* --------------------------
       TEXT
    -------------------------- */

    .eyebrow {
      display: inline-block;

      padding: 7px 16px;

      margin-bottom: 25px;

      background: #e8c0bd;

      font-family: "Caveat", cursive;

      font-size: 20px;

      color: #84515a;

      transform: rotate(-2deg);
    }

    h1 {
      max-width: 390px;

      font-family: "Playfair Display", serif;

      font-size: clamp(38px, 5vw, 49px);

      line-height: 1.12;

      letter-spacing: -1.3px;

      font-weight: 600;

      color: #51343a;

      margin-bottom: 17px;
    }

    .scribble-line {
      width: 90px;
      height: 5px;

      margin-bottom: 20px;

      border-radius: 50%;

      background: #b35f6c;

      transform: rotate(-2deg);
    }

    .subtitle {
      font-family: "Caveat", cursive;

      font-size: 23px;

      color: #89676c;

      margin-bottom: 35px;
    }

    /* --------------------------
       YES BUTTON
    -------------------------- */

    #yes {
      position: relative;

      width: 145px;
      height: 52px;

      border: none;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          #aa5664,
          #c26e79
        );

      color: #fffaf7;

      font-family: "DM Sans", sans-serif;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 13px 28px rgba(166,82,96,.30);

      transition:
        transform .2s ease,
        box-shadow .2s ease;

      z-index: 10;
    }

    #yes:hover {
      transform: translateY(-3px);

      box-shadow:
        0 17px 34px rgba(166,82,96,.40);
    }

    #yes:active {
      transform: scale(.96);
    }

    /* --------------------------
       NO BUTTON
    -------------------------- */

    #no {
      position: fixed;

      width: 115px;
      height: 48px;

      border: 1px solid rgba(96,64,68,.14);

      border-radius: 28px;

      background: rgba(255,249,245,.96);

      color: #72545a;

      font-family: "DM Sans", sans-serif;

      font-size: 15px;
      font-weight: 500;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(84,52,57,.16);

      z-index: 30;

      transition:
        left .12s ease-out,
        top .12s ease-out,
        transform .2s ease;

      visibility: hidden;
    }

    /* --------------------------
       SUCCESS SCREEN
    -------------------------- */

    .success {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 45px;

      background:
        linear-gradient(
          145deg,
          #fff9f5,
          #f4dcd9
        );

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .4s ease,
        visibility .4s ease;

      z-index: 20;
    }

    .success.show {
      opacity: 1;
      visibility: visible;
    }

    .success .little {
      font-family: "Caveat", cursive;

      font-size: 23px;

      color: #a15d68;

      margin-bottom: 12px;

      transform: rotate(-2deg);
    }

    .success h2 {
      font-family: "Playfair Display", serif;

      font-size: 44px;

      color: #50343a;

      margin-bottom: 16px;
    }

    .success p {
      max-width: 310px;

      font-family: "Caveat", cursive;

      font-size: 24px;

      line-height: 1.35;

      color: #806166;
    }

    /* --------------------------
       MOBILE
    -------------------------- */

    @media (max-width: 600px) {
      .card-wrap {
        width: 91vw;
      }

      .card {
        min-height: 450px;

        padding:
          60px 25px
          45px;
      }

      h1 {
        font-size: 37px;
      }

      .note {
        display: none;
      }

      .paper.one {
        width: 150px;
      }

      .paper.two {
        width: 130px;
      }
    }

  </style>
</head>

<body>

  <!-- scrapbook background -->

  <div class="paper one"></div>
  <div class="paper two"></div>
  <div class="paper three"></div>
  <div class="paper four"></div>

  <div class="note one">
    a very serious question...
  </div>

  <div class="note two">
    no pressure
  </div>


  <!-- main card -->

  <div class="card-wrap">

    <div class="back-paper"></div>
    <div class="back-paper-two"></div>

    <div class="mini-paper"></div>

    <main class="card">

      <div class="tape"></div>

      <div class="eyebrow">
        just wondering...
      </div>

      <h1>
        Daniel,<br>
        do you love me?
      </h1>

      <div class="scribble-line"></div>

      <p class="subtitle">
        think very carefully
      </p>

      <button id="yes">
        Yes
      </button>


      <div
        class="success"
        id="success"
      >

        <div class="little">
          excellent choice
        </div>

        <h2>
          I knew it.
        </h2>

        <p>
          This answer is now permanent
          and legally cannot be changed.
        </p>

      </div>

    </main>

  </div>


  <!--
    NO is intentionally outside the card.

    This lets it escape around the entire
    screen instead of being trapped inside
    the little button area.
  -->

  <button id="no">
    No
  </button>


  <script>

    const yesButton =
      document.getElementById("yes");

    const noButton =
      document.getElementById("no");

    const success =
      document.getElementById("success");


    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;


    /* ---------------------------------
       RECTANGLE COLLISION
    --------------------------------- */

    function rectanglesOverlap(
      first,
      second,
      padding = 0
    ) {

      return !(
        first.right + padding <
        second.left ||

        first.left - padding >
        second.right ||

        first.bottom + padding <
        second.top ||

        first.top - padding >
        second.bottom
      );

    }


    /* ---------------------------------
       GET A SAFE NO POSITION
    --------------------------------- */

    function getSafePosition() {

      const noWidth =
        noButton.offsetWidth;

      const noHeight =
        noButton.offsetHeight;


      const screenPadding = 30;


      const maxX =
        window.innerWidth -
        noWidth -
        screenPadding;

      const maxY =
        window.innerHeight -
        noHeight -
        screenPadding;


      const yesRect =
        yesButton.getBoundingClientRect();


      let bestPosition = null;

      let bestDistance = -1;


      /*
        Try lots of positions around
        the ENTIRE browser window.
      */

      for (
        let i = 0;
        i < 120;
        i++
      ) {

        const x =
          screenPadding +
          Math.random() *
          Math.max(
            maxX -
            screenPadding,
            1
          );


        const y =
          screenPadding +
          Math.random() *
          Math.max(
            maxY -
            screenPadding,
            1
          );


        const candidate = {

          left: x,

          top: y,

          right:
            x + noWidth,

          bottom:
            y + noHeight

        };


        /*
          NEVER allow NO to overlap YES.

          55px gives YES some breathing
          room too.
        */

        if (
          rectanglesOverlap(
            candidate,
            yesRect,
            55
          )
        ) {
          continue;
        }


        const centerX =
          x +
          noWidth / 2;

        const centerY =
          y +
          noHeight / 2;


        const distance =
          Math.hypot(
            centerX - mouseX,
            centerY - mouseY
          );


        /*
          Prefer positions that are
          very far from the cursor.
        */

        if (
          distance >
          bestDistance
        ) {

          bestDistance =
            distance;

          bestPosition = {
            x,
            y
          };

        }

      }


      return bestPosition;

    }


    /* ---------------------------------
       MOVE NO
    --------------------------------- */

    function moveNoButton() {

      const position =
        getSafePosition();


      if (!position) {
        return;
      }


      noButton.style.left =
        position.x + "px";

      noButton.style.top =
        position.y + "px";

    }


    /* ---------------------------------
       INITIAL NO POSITION
    --------------------------------- */

    function placeNoInitially() {

      const yesRect =
        yesButton.getBoundingClientRect();


      const noWidth =
        noButton.offsetWidth;


      let startingX =
        yesRect.right + 22;


      let startingY =
        yesRect.top + 2;


      /*
        If there isn't room beside YES,
        put NO underneath it.
      */

      if (
        startingX +
        noWidth >
        window.innerWidth - 20
      ) {

        startingX =
          yesRect.left +
          yesRect.width / 2 -
          noWidth / 2;

        startingY =
          yesRect.bottom + 20;

      }


      noButton.style.left =
        startingX + "px";

      noButton.style.top =
        startingY + "px";

      noButton.style.visibility =
        "visible";

    }


    window.addEventListener(
      "load",
      placeNoInitially
    );


    /* ---------------------------------
       CURSOR TRACKING
    --------------------------------- */

    document.addEventListener(
      "mousemove",
      function(event) {

        mouseX =
          event.clientX;

        mouseY =
          event.clientY;


        const rect =
          noButton.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;

        const centerY =
          rect.top +
          rect.height / 2;


        const distance =
          Math.hypot(
            event.clientX -
            centerX,

            event.clientY -
            centerY
          );


        /*
          It escapes BEFORE the cursor
          actually reaches the button.
        */

        if (
          distance < 135
        ) {

          moveNoButton();

        }

      }
    );


    /*
      Backup in case the mouse somehow
      reaches the button.
    */

    noButton.addEventListener(
      "mouseenter",
      moveNoButton
    );


    /* ---------------------------------
       MOBILE
    --------------------------------- */

    noButton.addEventListener(
      "touchstart",
      function(event) {

        event.preventDefault();


        const touch =
          event.touches[0];


        if (touch) {

          mouseX =
            touch.clientX;

          mouseY =
            touch.clientY;

        }


        moveNoButton();

      },
      {
        passive: false
      }
    );


    /* ---------------------------------
       YES
    --------------------------------- */

    yesButton.addEventListener(
      "click",
      function() {

        success.classList.add(
          "show"
        );

        noButton.style.display =
          "none";

      }
    );


    /* ---------------------------------
       RESIZE
    --------------------------------- */

    window.addEventListener(
      "resize",
      function() {

        if (
          !success.classList.contains(
            "show"
          )
        ) {

          placeNoInitially();

        }

      }
    );

  </script>

</body>
</html>
