<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Do You Love Me?</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0d1117;
      color: #f0f6fc;

      font-family: "DM Sans", sans-serif;

      overflow: hidden;
    }

    /* subtle background glow */

    body::before {
      content: "";
      position: fixed;

      width: 500px;
      height: 500px;

      background: rgba(88, 166, 255, 0.08);

      border-radius: 50%;
      filter: blur(100px);

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;
    }

    .card {
      width: min(90%, 500px);

      padding: 65px 45px;

      background: #161b22;

      border: 1px solid #30363d;
      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4);

      position: relative;

      animation: appear 0.7s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .small-text {
      color: #8b949e;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      font-weight: 600;

      letter-spacing: -1.5px;

      margin-bottom: 15px;
    }

    .subtitle {
      color: #8b949e;

      font-size: 16px;

      margin-bottom: 45px;
    }

    .buttons {
      position: relative;

      height: 70px;

      width: 100%;
    }

    button {
      position: absolute;

      width: 125px;
      height: 48px;

      border-radius: 8px;

      font-family: inherit;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    #yes {
      left: calc(50% - 135px);

      background: #f0f6fc;
      color: #0d1117;

      border: 1px solid #f0f6fc;
    }

    #yes:hover {
      background: #ffffff;

      transform: translateY(-2px);
    }

    #no {
      left: calc(50% + 10px);

      background: transparent;
      color: #c9d1d9;

      border: 1px solid #30363d;

      transition:
        left 0.18s ease,
        top 0.18s ease,
        background 0.2s ease;
    }

    #no:hover {
      background: #21262d;
    }

    .message {
      min-height: 25px;

      margin-top: 25px;

      color: #8b949e;

      font-size: 14px;

      opacity: 0;

      transition: opacity 0.3s ease;
    }

    .message.show {
      opacity: 1;
    }

    @media (max-width: 520px) {
      .card {
        padding: 50px 25px;
      }

      h1 {
        font-size: 34px;
      }

      button {
        width: 105px;
      }

      #yes {
        left: calc(50% - 115px);
      }

      #no {
        left: calc(50% + 10px);
      }
    }
  </style>
</head>

<body>

  <main class="card" id="card">

    <div class="small-text">
      IMPORTANT QUESTION
    </div>

    <h1>
      Do you love me?
    </h1>

    <p class="subtitle">
      Choose carefully.
    </p>

    <div class="buttons" id="buttonArea">

      <button id="yes">
        Yes
      </button>

      <button id="no">
        No
      </button>

    </div>

    <div class="message" id="message">
      Correct answer.
    </div>

  </main>

  <script>

    const noButton =
      document.getElementById("no");

    const yesButton =
      document.getElementById("yes");

    const buttonArea =
      document.getElementById("buttonArea");

    const message =
      document.getElementById("message");


    /* NO button runs away */

    function moveNoButton() {

      const areaRect =
        buttonArea.getBoundingClientRect();

      const buttonRect =
        noButton.getBoundingClientRect();

      const maxX =
        areaRect.width - buttonRect.width;

      const maxY =
        areaRect.height - buttonRect.height;

      const randomX =
        Math.random() * maxX;

      const randomY =
        Math.random() * maxY;

      noButton.style.left =
        randomX + "px";

      noButton.style.top =
        randomY + "px";
    }


    noButton.addEventListener(
      "mouseenter",
      moveNoButton
    );


    /* Also works better on phones */

    noButton.addEventListener(
      "touchstart",
      function(event) {

        event.preventDefault();

        moveNoButton();

      }
    );


    /* YES button */

    yesButton.addEventListener(
      "click",
      function() {

        message.classList.add("show");

        yesButton.textContent =
          "I knew it.";

        noButton.style.display =
          "none";

      }
    );

  </script>

</body>
</html>
